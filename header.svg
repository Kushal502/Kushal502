<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-label="Kushal Basnet — Computing Systems, Ulster University London">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#14161b"/>
      <stop offset="52%"  stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    /* Canvas is deliberately small (760 wide) so that when GitHub scales the
       banner down on a phone the type stays legible. Sizes are large relative
       to the canvas for the same reason. */
    .name { font: 700 62px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            fill:#fff; letter-spacing:.5px }
    .sub  { font: 500 27px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            fill:#ffe8d8 }
    .rule { stroke:#ffffff; stroke-opacity:.42; stroke-width:2; stroke-linecap:round }

    .f1 { opacity:0; animation: fade .9s ease-out .10s forwards }
    .f2 { opacity:0; animation: grow .9s ease-out .40s forwards }
    .f3 { opacity:0; animation: fade .9s ease-out .60s forwards }
    @keyframes fade { to { opacity:1 } }
    @keyframes grow { from { opacity:0; transform:scaleX(.2) } to { opacity:1; transform:scaleX(1) } }

    /* one wave period is 380 units and the shift is exactly -380, so the
       loop repeats with no visible seam */
    .w1 { animation: roll 12s linear infinite }
    .w2 { animation: roll 19s linear infinite }
    @keyframes roll { from { transform: translateX(0) } to { transform: translateX(-380px) } }

    @media (prefers-reduced-motion: reduce) {
      .f1,.f2,.f3 { opacity:1; animation:none; transform:none }
      .w1,.w2 { animation:none }
    }
  </style>

  <rect width="760" height="200" fill="url(#bg)"/>
  <rect width="760" height="104" fill="url(#sheen)"/>

  <g class="w2" opacity=".26">
    <path fill="#fff" d="M0,158 q95,-22 190,0 t190,0 t190,0 t190,0 t190,0 t190,0 t190,0 t190,0 V200 H0 Z"/>
  </g>
  <g class="w1" opacity=".15">
    <path fill="#fff" d="M0,172 q95,-26 190,0 t190,0 t190,0 t190,0 t190,0 t190,0 t190,0 t190,0 V200 H0 Z"/>
  </g>

  <text class="name f1" x="380" y="86" text-anchor="middle">Kushal Basnet</text>
  <line class="rule f2" x1="300" y1="106" x2="460" y2="106" style="transform-origin:380px 106px"/>
  <text class="sub f3"  x="380" y="134" text-anchor="middle">Computing Systems · Networking &amp; Security</text>
</svg>
