<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="Kushal Basnet — Computing Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#16181d"/>
      <stop offset="48%"  stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    /* fade the text in, like the capsule-render fadeIn */
    .fade  { opacity:0; animation: fade 1.1s ease-out .15s forwards }
    .fade2 { opacity:0; animation: fade 1.1s ease-out .45s forwards }
    .fade3 { opacity:0; animation: fade 1.1s ease-out .75s forwards }
    @keyframes fade { to { opacity:1 } }

    /* two waves rolling at different speeds — one period is 500 units, so
       translating by exactly -500 loops seamlessly with no visible jump */
    .w1 { animation: roll 11s linear infinite }
    .w2 { animation: roll 17s linear infinite }
    @keyframes roll { from { transform: translateX(0) } to { transform: translateX(-500px) } }

    .name { font: 700 44px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#fff }
    .sub  { font: 400 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#ffe3d0 }
    .tag  { font: 500 13px ui-monospace, 'JetBrains Mono', Consolas, monospace; fill:#ffd2b0 }

    @media (prefers-reduced-motion: reduce) {
      .fade,.fade2,.fade3 { opacity:1; animation:none }
      .w1,.w2 { animation:none }
    }
  </style>

  <rect width="1000" height="180" fill="url(#bg)"/>
  <rect width="1000" height="90" fill="url(#glow)"/>

  <!-- back wave, slower and dimmer. Crest sits at y=129, clear of the text. -->
  <g class="w2" opacity=".28">
    <path fill="#ffffff"
      d="M0,142 q125,-26 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V180 H0 Z"/>
  </g>
  <!-- front wave -->
  <g class="w1" opacity=".16">
    <path fill="#ffffff"
      d="M0,156 q125,-30 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V180 H0 Z"/>
  </g>

  <text class="name fade"  x="50" y="70">Kushal Basnet</text>
  <text class="sub  fade2" x="52" y="100">Computing Systems · Ulster University, London</text>
  <text class="tag  fade3" x="52" y="126">networking · traffic analysis · full-stack</text>
</svg>
